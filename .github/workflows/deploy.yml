name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch personal projects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "/users/${GITHUB_REPOSITORY_OWNER}/repos?per_page=100&type=public" --paginate \
            --jq '.[] | select(.fork == false and .stargazers_count > 0) | {name, description, html_url, stargazers_count, forks_count, language, updated_at}' \
            | jq -s '.' > static/repos.json
          echo "Fetched $(jq length static/repos.json) personal projects"

      - name: Fetch merged contributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner_lc="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"

          # 1. Collect merged PRs authored by the user in repos they don't own.
          gh api -X GET search/issues --paginate \
            -f q="type:pr is:merged author:${GITHUB_REPOSITORY_OWNER}" \
            --jq ".items[]
                  | select(.pull_request != null)
                  | select((.repository_url | ascii_downcase | test(\"/repos/${owner_lc}/\")) | not)
                  | {title, html_url, repo: (.repository_url | sub(\"https://api.github.com/repos/\"; \"\")), merged_at: .pull_request.merged_at}" \
            | jq -s '.' > /tmp/prs.json

          # 2. Look up each unique repo's star count.
          stars_json="{}"
          for repo in $(jq -r '.[].repo' /tmp/prs.json | sort -u); do
            count="$(gh api "/repos/${repo}" --jq '.stargazers_count' 2>/dev/null || echo 0)"
            stars_json="$(jq -n --argjson m "$stars_json" --arg r "$repo" --argjson c "${count:-0}" '$m + {($r): $c}')"
          done

          # 3. Keep only contributions to repos with more than 5 stars, newest first.
          jq --argjson stars "$stars_json" '
            map(. + {stars: ($stars[.repo] // 0)})
            | map(select(.stars > 5))
            | sort_by(.merged_at) | reverse
          ' /tmp/prs.json > static/contributions.json
          echo "Fetched $(jq length static/contributions.json) contributions (repos with >5 stars)"

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1

      - name: Build site
        run: zola build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
