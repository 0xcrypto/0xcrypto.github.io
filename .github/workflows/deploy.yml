name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch public repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "/users/${GITHUB_REPOSITORY_OWNER}/repos?per_page=100&type=public" --paginate \
            --jq '.[] | select(.fork == false) | {name, description, html_url, stargazers_count, forks_count, language, updated_at}' \
            | jq -s '.' > static/repos.json
          echo "Fetched $(jq length static/repos.json) repos"

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.19.2

      - name: Build site
        run: zola build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public