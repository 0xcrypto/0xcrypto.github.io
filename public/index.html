<script>
(function() {
  var buttons = document.querySelectorAll('.sort-controls button');
  var grid = document.getElementById('repos-grid');
  var cards = Array.from(grid.querySelectorAll('.repo-card'));

  function sortCards(key) {
    var sorted = cards.slice().sort(function(a, b) {
      var va = a.getAttribute('data-' + key);
      var vb = b.getAttribute('data-' + key);
      if (key === 'name') return va.localeCompare(vb);
      if (key === 'updated') return vb.localeCompare(va);
      return parseInt(vb) - parseInt(va);
    });
    sorted.forEach(function(card) { grid.appendChild(card); });
  }

  buttons.forEach(function(btn) {
    btn.addEventListener('click', function() {
      buttons.forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      sortCards(btn.getAttribute('data-sort'));
    });
  });
})();
</script>
